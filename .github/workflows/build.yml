name: Build APK

# Every push to main builds an APK and attaches it to the workflow run.
# Pushing a tag like v2.14 also publishes a GitHub Release with the APK
# (that is what Obtainium tracks).
#
# Signing: add these repository secrets (Settings -> Secrets and variables ->
# Actions) so every build is signed with the same key and installs as an
# update over the previous one:
#   KEYSTORE_BASE64    base64 of your .jks file
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
# Without them the workflow builds a debug APK signed with a throwaway key,
# which will NOT install over a previous build (uninstall first).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets set; building a debug APK with a throwaway key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        run: |
          version=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            src=$(ls app/build/outputs/apk/release/*.apk | head -1)
            name="video-boost-ao-${version}.apk"
          else
            src=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            name="video-boost-ao-${version}-debug.apk"
          fi
          mkdir -p dist && cp "$src" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.apk.outputs.name }}
          generate_release_notes: true

      - name: Clean up signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
